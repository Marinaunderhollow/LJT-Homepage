name: Validate site

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build and validate
        run: |
          bundle exec jekyll build --baseurl "/LJT-Homepage"
          echo "== checking home =="
          grep -q "Junteng Liu" _site/index.html && echo "OK name"
          grep -q "HKUST NLP Group" _site/index.html && echo "OK group"
          grep -q "Shanghai Jiao Tong University" _site/index.html && echo "OK SJTU"
          grep -q "MINIMAX" _site/index.html && echo "OK MINIMAX"
          grep -q "Tencent WXG" _site/index.html && echo "OK Tencent"
          grep -q "Shanghai AI Lab" _site/index.html && echo "OK Shanghai AI Lab"
          grep -q "SynLogic" _site/index.html && echo "OK SynLogic"
          grep -q "C-Eval" _site/index.html && echo "OK C-Eval"
          grep -q "jliugi@connect.ust.hk" _site/index.html && echo "OK email"
          echo "== checking publications =="
          grep -q "SynLogic" _site/publications/index.html && echo "OK pub SynLogic"
          grep -q "On the Perception Bottleneck" _site/publications/index.html && echo "OK pub Perception"
          grep -q "On the Universal Truthfulness Hyperplane" _site/publications/index.html && echo "OK pub Truthfulness"
          grep -q "In-Context Sharpness" _site/publications/index.html && echo "OK pub Sharpness"
          grep -q "C-Eval" _site/publications/index.html && echo "OK pub C-Eval"
          grep -q "Composing Parameter-Efficient Modules" _site/publications/index.html && echo "OK pub Composing"
          echo "== html files =="
          find _site -maxdepth 3 -name "*.html" | sort
